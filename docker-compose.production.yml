
services:
  pradnya-api:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/pradnya-backend:${IMAGE_TAG:-latest}
    container_name: pradnya-api
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${PRADNYA_ALLOWED_ORIGINS:-http://localhost:30309}
    ports:
      - "30308:8000"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pradnya-net

  pradnya-web:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/pradnya-frontend:${IMAGE_TAG:-latest}
    container_name: pradnya-web
    restart: unless-stopped
    depends_on:
      pradnya-api:
        condition: service_healthy
    ports:
      - "30309:80"
    networks:
      - pradnya-net

networks:
  pradnya-net:
    driver: bridge