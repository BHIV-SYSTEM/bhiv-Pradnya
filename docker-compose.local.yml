
services:
  pradnya-api:
    image: localtest/pradnya-backend:local
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: "http://localhost:30309"
    ports:
      - "30308:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pradnya-local-net

  pradnya-web:
    image: localtest/pradnya-frontend:local
    restart: unless-stopped
    depends_on:
      pradnya-api:
        condition: service_healthy
    ports:
      - "30309:80"
    networks:
      - pradnya-local-net

networks:
  pradnya-local-net:
    driver: bridge