
name: Pradnya - Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pradnya-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            main.py requirements.txt Dockerfile .dockerignore \
            docker-compose.production.yml \
            frontend/Dockerfile frontend/nginx.conf \
            frontend/package.json frontend/package-lock.json
          do
            test -f "$file" || {
              echo "::error::Missing file: $file"
              exit 1
            }
          done

      - name: Validate Compose
        env:
          DOCKER_USERNAME: validation
          IMAGE_TAG: validation
          PRADNYA_ALLOWED_ORIGINS: http://localhost:8025
        run: docker compose -f docker-compose.production.yml config -q

  build-and-push:
    name: Build and push Docker images
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKER_USERNAME" || {
            echo "::error::DOCKER_USERNAME is missing"
            exit 1
          }
          test -n "$DOCKER_PASSWORD" || {
            echo "::error::DOCKER_PASSWORD is missing"
            exit 1
          }

      - name: Prepare frontend environment
        env:
          FRONTEND_ENV_FILE: ${{ secrets.PRADNYA_FRONTEND_ENV_FILE }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FRONTEND_ENV_FILE:-}" ]]; then
            echo "::error::PRADNYA_FRONTEND_ENV_FILE is empty or missing"
            exit 1
          fi

          printf '%s\n' "$FRONTEND_ENV_FILE" > frontend/.env.production

          if ! grep -q '^VITE_NICAI_API=' frontend/.env.production; then
            printf '\nVITE_NICAI_API=/api\n' >> frontend/.env.production
          fi

          echo "Frontend production environment prepared."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pradnya-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/pradnya-backend:latest
          cache-from: type=gha,scope=pradnya-backend
          cache-to: type=gha,mode=max,scope=pradnya-backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pradnya-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/pradnya-frontend:latest
          cache-from: type=gha,scope=pradnya-frontend
          cache-to: type=gha,mode=max,scope=pradnya-frontend

  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    env:
      VM_IP: ${{ secrets.VM_IP }}
      VM_USERNAME: ${{ secrets.VM_USERNAME }}
      VM_PORT: ${{ secrets.VM_PORT }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      PRADNYA_ALLOWED_ORIGINS: ${{ vars.PRADNYA_ALLOWED_ORIGINS }}

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate deployment secrets
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in VM_IP VM_USERNAME SSHPASS DOCKER_USERNAME DOCKER_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          PORT="${VM_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          ssh-keyscan -p "$PORT" -H "$VM_IP" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy Compose file to VM
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          sshpass -e scp \
            -o StrictHostKeyChecking=yes \
            -P "${VM_PORT:-22}" \
            docker-compose.production.yml \
            "$VM_USERNAME@$VM_IP:docker-compose.production.yml"

      - name: Deploy, health-check and rollback
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          PASSWORD_B64="$(printf '%s' "$DOCKER_PASSWORD" | base64 -w 0)"
          ORIGINS="${PRADNYA_ALLOWED_ORIGINS:-http://localhost:8025}"
          ORIGINS_B64="$(printf '%s' "$ORIGINS" | base64 -w 0)"

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -p "${VM_PORT:-22}" \
            "$VM_USERNAME@$VM_IP" \
            "bash -s" <<REMOTE
          set -Eeuo pipefail

          APP_DIR="\$HOME/PRADNYA"
          mkdir -p "\$APP_DIR"

          install -m 600 "\$HOME/docker-compose.production.yml" \
            "\$APP_DIR/docker-compose.production.yml"
          cd "\$APP_DIR"

          export DOCKER_USERNAME='$DOCKER_USERNAME'
          export IMAGE_TAG='$IMAGE_TAG'
          export PRADNYA_ALLOWED_ORIGINS="\$(printf '%s' '$ORIGINS_B64' | base64 -d)"

          COMPOSE=(docker compose -p pradnya -f docker-compose.production.yml)

          echo "Validating Compose configuration..."
          "\${COMPOSE[@]}" config -q

          echo "Logging in to Docker Hub..."
          printf '%s' '$PASSWORD_B64' | base64 -d |
            docker login -u "\$DOCKER_USERNAME" --password-stdin

          PREVIOUS_TAG="\$(cat .last-successful-image-tag 2>/dev/null || true)"

          echo "Pulling release \$IMAGE_TAG..."
          "\${COMPOSE[@]}" pull

          check_health() {
            local i

            for i in \$(seq 1 24); do
              echo "Health check \$i/24"

              if curl -fsS --max-time 5 \
                   http://127.0.0.1:8024/health >/dev/null &&
                 curl -fsS --max-time 5 \
                   http://127.0.0.1:8025/ >/dev/null; then
                echo "Backend and frontend checks passed."
                return 0
              fi

              sleep 5
            done

            return 1
          }

          if "\${COMPOSE[@]}" up -d --remove-orphans &&
             check_health; then
            printf '%s\n' "\$IMAGE_TAG" > .last-successful-image-tag
            echo "Deployment succeeded: \$IMAGE_TAG"
            "\${COMPOSE[@]}" ps
            exit 0
          fi

          echo "Deployment failed. Collecting logs..."
          "\${COMPOSE[@]}" ps || true
          "\${COMPOSE[@]}" logs --tail=150 || true

          if [[ -n "\$PREVIOUS_TAG" && "\$PREVIOUS_TAG" != "\$IMAGE_TAG" ]]; then
            echo "Attempting rollback to \$PREVIOUS_TAG..."
            export IMAGE_TAG="\$PREVIOUS_TAG"

            if "\${COMPOSE[@]}" pull &&
               "\${COMPOSE[@]}" up -d --remove-orphans &&
               check_health; then
              echo "Rollback succeeded."
            else
              echo "Rollback failed; manual investigation is required."
              "\${COMPOSE[@]}" ps || true
              "\${COMPOSE[@]}" logs --tail=150 || true
            fi
          else
            echo "No previous successful release is recorded."
          fi

          exit 1
          REMOTE
