
name: Pradnya - Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pradnya-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            main.py \
            requirements.txt \
            Dockerfile \
            docker-compose.production.yml \
            frontend/Dockerfile \
            frontend/nginx.conf \
            frontend/package.json \
            frontend/package-lock.json
          do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

      - name: Validate Docker Compose
        env:
          DOCKER_USERNAME: validation
          IMAGE_TAG: validation
          PRADNYA_ALLOWED_ORIGINS: http://localhost:8025
        run: docker compose -f docker-compose.production.yml config -q

  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pradnya-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/pradnya-backend:latest
          cache-from: type=gha,scope=pradnya-backend
          cache-to: type=gha,mode=max,scope=pradnya-backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_NICAI_API=/api
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pradnya-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/pradnya-frontend:latest
          cache-from: type=gha,scope=pradnya-frontend
          cache-to: type=gha,mode=max,scope=pradnya-frontend

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy production Compose file
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PORT: ${{ secrets.VM_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VM_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p "$PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

          sshpass -e scp \
            -P "$PORT" \
            docker-compose.production.yml \
            "$VM_USERNAME@$VM_HOST:~/docker-compose.production.yml"

      - name: Deploy and verify, with rollback attempt
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PORT: ${{ secrets.VM_PORT }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          PRADNYA_ALLOWED_ORIGINS: ${{ vars.PRADNYA_ALLOWED_ORIGINS }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          PORT="${VM_PORT:-22}"
          ORIGINS="${PRADNYA_ALLOWED_ORIGINS:-http://localhost:8025}"
          PASSWORD_B64="$(printf '%s' "$DOCKER_PASSWORD" | base64 -w 0)"
          ORIGINS_B64="$(printf '%s' "$ORIGINS" | base64 -w 0)"

          sshpass -e ssh \
            -p "$PORT" \
            "$VM_USERNAME@$VM_HOST" \
            "DOCKER_USERNAME='$DOCKER_USERNAME' IMAGE_TAG='$IMAGE_TAG' PASSWORD_B64='$PASSWORD_B64' ORIGINS_B64='$ORIGINS_B64' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/PRADNYA"
          mkdir -p "$APP_DIR"
          mv "$HOME/docker-compose.production.yml" "$APP_DIR/docker-compose.production.yml"
          cd "$APP_DIR"

          export DOCKER_USERNAME IMAGE_TAG
          export PRADNYA_ALLOWED_ORIGINS
          PRADNYA_ALLOWED_ORIGINS="$(printf '%s' "$ORIGINS_B64" | base64 -d)"

          # Authenticate so private Docker Hub images can be pulled.
          printf '%s' "$PASSWORD_B64" | base64 -d |
            docker login -u "$DOCKER_USERNAME" --password-stdin

          COMPOSE="docker compose -p pradnya -f docker-compose.production.yml"
          PREVIOUS_TAG="$(cat .last-successful-image-tag 2>/dev/null || true)"

          echo "Pulling release: $IMAGE_TAG"
          $COMPOSE pull

          check_health() {
            local i
            for i in $(seq 1 18); do
              if curl -fsS --max-time 5 http://127.0.0.1:8024/health >/dev/null &&
                 curl -fsS --max-time 5 http://127.0.0.1:8025/ >/dev/null; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          if $COMPOSE up -d --remove-orphans && check_health; then
            printf '%s\n' "$IMAGE_TAG" > .last-successful-image-tag
            echo "Deployment succeeded: $IMAGE_TAG"
            $COMPOSE ps
            exit 0
          fi

          echo "Deployment or health check failed."
          $COMPOSE logs --tail=100 || true

          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
            echo "Attempting rollback to: $PREVIOUS_TAG"
            export IMAGE_TAG="$PREVIOUS_TAG"

            if $COMPOSE pull && $COMPOSE up -d --remove-orphans && check_health; then
              echo "Rollback succeeded: $PREVIOUS_TAG"
            else
              echo "Rollback health check failed; manual investigation is required."
              $COMPOSE logs --tail=100 || true
            fi
          else
            echo "No previous successful release is recorded; automatic rollback is unavailable."
          fi

          exit 1
          REMOTE